apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-httproute-from-sample-app
  namespace: cloudflare-gateway
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: sample-app
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: yh-cluster
