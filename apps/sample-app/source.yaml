apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: sample-app-k8s
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/ROBO358/sample-app-k8s
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sample-app
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./manifests
  prune: true
  serviceAccountName: flux-sample-app
  dependsOn:
    - name: cilium-config
    - name: longhorn
    - name: external-secrets-config
    - name: cert-manager-config
    - name: cloudflare-gateway-config
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: sample-app-k8s
  wait: true
  timeout: 10m
