apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare
  namespace: cloudflare-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare
  data:
    - secretKey: ACCOUNT_ID
      remoteRef:
        key: cloudflare-gateway-api-token/account-id
    - secretKey: TOKEN
      remoteRef:
        key: cloudflare-gateway-api-token/api-token
