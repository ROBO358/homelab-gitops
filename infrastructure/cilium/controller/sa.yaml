apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-cilium
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: flux-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helm-cilium-applier
  labels:
    app.kubernetes.io/part-of: flux-rbac
subjects:
  - kind: ServiceAccount
    name: helm-cilium
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
