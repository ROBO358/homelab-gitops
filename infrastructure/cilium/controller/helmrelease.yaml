apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m
  # releaseName must match the bootstrap release name so Flux adopts existing resources
  # (Helm 3.2+ PR #7649: resources with meta.helm.sh/release-name=cilium are adopted)
  releaseName: cilium
  targetNamespace: kube-system
  chart:
    spec:
      chart: cilium
      # Keep in sync with yh-talos Taskfile.yml CILIUM_VERSION
      version: "1.19.2"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 12h
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
  rollback:
    force: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    # ============================================================
    # Talos-specific settings — must match yh-talos cilium/values.yaml
    #
    # These are required for Talos compatibility. Omitting any of these
    # would cause Flux upgrade to revert to chart defaults (e.g. SYS_MODULE
    # would be added back, breaking Cilium agent on Talos nodes).
    # ============================================================
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # localhost:7445 = KubePrism, Talos's built-in local API proxy
    kubeProxyReplacement: "true"
    k8sServiceHost: localhost
    k8sServicePort: 7445

    ipam:
      mode: kubernetes

    # WireGuard transparent encryption for pod-to-pod traffic (node-to-node overlay)
    # nodeEncryption: false = host network traffic is not encrypted
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: false

    # Disable standalone envoy DaemonSet (not needed without L7 policy)
    envoy:
      enabled: false

    hubble:
      relay:
        enabled: true
      ui:
        enabled: true

    l2announcements:
      enabled: true
    # Mitigate operator API call increase from L2 announcements
    k8sClientRateLimit:
      qps: 50
      burst: 100
