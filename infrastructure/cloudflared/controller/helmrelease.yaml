apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 10m
  serviceAccountName: helm-cloudflared
  releaseName: cloudflared
  targetNamespace: cloudflared
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      # Keep in sync with Taskfile.yml CLOUDFLARED_CHART_VERSION
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: cloudflared
      interval: 12h
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
  # Inject tunnel token from ESO-managed Secret without embedding it in Git
  valuesFrom:
    - kind: Secret
      name: cloudflared-tunnel-token
      valuesKey: token
      targetPath: cloudflare.tunnel_token
  values:
    # Simplify resource names (default would be cloudflared-cloudflare-tunnel-remote)
    fullnameOverride: cloudflared
    replicaCount: 2
