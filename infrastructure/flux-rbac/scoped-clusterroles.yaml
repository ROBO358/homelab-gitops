kind: ClusterRole
metadata:
  name: helm-dex-role
  labels:
    app.kubernetes.io/part-of: flux-rbac
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [dex, admin]
    verbs: [bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [escalate]
  # admin ClusterRole には bind/escalate が含まれないため补完
  # dex chart が dex namespace に Role/RoleBinding(dex.coreos.com/* 含む)を作成するため必要
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helm-longhorn-role
  labels:
    app.kubernetes.io/part-of: flux-rbac
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # longhorn-support-bundle CRB が cluster-admin を参照するため cluster-admin の bind が必要
  # これは chart の設計制約であり、Longhorn のスコープ限定の本質的な限界
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [longhorn-role, cluster-admin, admin]
    verbs: [bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [escalate]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [longhorn.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
---
