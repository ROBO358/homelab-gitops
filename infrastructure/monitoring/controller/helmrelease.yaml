apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 10m
  serviceAccountName: helm-monitoring
  releaseName: monitoring
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      # Keep in sync with Taskfile.yml KPS_VERSION
      version: "84.4.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    crds:
      enabled: true

    # kube-proxy は Cilium が代替しているため無効
    kubeProxy:
      enabled: false

    # ── Prometheus ──────────────────────────────────────────
    prometheus:
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 15Gi

    # ── Grafana ─────────────────────────────────────────────
    grafana:
      admin:
        existingSecret: monitoring-grafana-admin
        userKey: username
        passwordKey: password
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi

    # ── Alertmanager ────────────────────────────────────────
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
