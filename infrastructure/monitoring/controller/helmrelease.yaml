apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 10m
  timeout: 20m
  serviceAccountName: helm-monitoring
  releaseName: monitoring
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      # Keep in sync with Taskfile.yml KPS_VERSION
      version: "84.4.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    crds:
      enabled: true

    # kube-proxy は Cilium が代替しているため無効
    kubeProxy:
      enabled: false

    # Talos では kube-scheduler / kube-controller-manager が 127.0.0.1 にバインドされており
    # Prometheus から到達不能なため、ServiceMonitor を無効化して TargetDown アラートを抑制する
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false

    # ── Prometheus ──────────────────────────────────────────
    prometheus:
      prometheusSpec:
        retention: 7d
        # Resend firing alerts to Alertmanager every 30s (default 1m).
        # Needed to achieve ~30-60s Healthchecks.io heartbeat cadence.
        additionalArgs:
          - name: rules.alert.resend-delay
            value: 30s
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 15Gi
        additionalScrapeConfigsSecret:
          name: healthchecks-scrape-config
          key: scrape-config.yaml

        # remoteWrite sli:* recording rules + hc_* (Healthchecks.io) to Grafana Cloud (14d retention)
        remoteWrite:
          - url: https://prometheus-prod-49-prod-ap-northeast-0.grafana.net/api/prom/push
            basicAuth:
              username:
                name: monitoring-grafana-cloud
                key: username
              password:
                name: monitoring-grafana-cloud
                key: password
            writeRelabelConfigs:
              - sourceLabels: [__name__]
                regex: 'sli:.*|hc_.*'
                action: keep

    # ── Grafana ─────────────────────────────────────────────
    grafana:
      admin:
        existingSecret: monitoring-grafana-admin
        userKey: username
        passwordKey: password
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi

    # ── Alertmanager ────────────────────────────────────────
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: default
          routes:
            - matchers:
                - alertname = Watchdog
              receiver: healthchecks
              group_interval: 15s
              repeat_interval: 30s
              continue: false
            - matchers:
                - severity = critical
              receiver: discord-critical
            - matchers:
                - severity = warning
              receiver: discord-warning
        inhibit_rules:
          - source_matchers: [severity = critical]
            target_matchers: [severity = warning]
            equal: [alertname, namespace]
        receivers:
          - name: default
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/monitoring-healthchecks/webhook-url
                send_resolved: false
          # Discord webhook URL in 1Password must include the /slack suffix:
          # https://discord.com/api/webhooks/{id}/{token}/slack
          - name: discord-critical
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/monitoring-discord/webhook-url
                send_resolved: true
                title: "[CRITICAL] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
                text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
          - name: discord-warning
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/monitoring-discord/webhook-url
                send_resolved: true
                title: "[WARNING] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
                text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
      alertmanagerSpec:
        # Mount secrets so Alertmanager can read webhook URLs from files
        secrets:
          - monitoring-discord
          - monitoring-healthchecks
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
