apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: monitoring
spec:
  # Apply to all pods in the monitoring namespace
  endpointSelector: {}
  ingress:
    # Allow all intra-namespace traffic (Prometheus→Alertmanager, Grafana→Prometheus, etc.)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
    # Allow Prometheus from any namespace to scrape metrics ports
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    # Allow Cilium Gateway API proxy to reach Grafana UI.
    # Cilium assigns identity "ingress" to Envoy gateway proxy traffic (not "host"),
    # regardless of cilium-envoy using hostNetwork.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Allow cloudflared tunnel pods to reach Grafana (for external probe routing)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cloudflare-gateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
