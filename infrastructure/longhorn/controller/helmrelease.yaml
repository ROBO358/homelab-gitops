apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  serviceAccountName: helm-longhorn
  releaseName: longhorn
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      # Keep in sync with Taskfile.yml LONGHORN_VERSION
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 12h
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
  rollback:
    force: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      defaultReplicaCount: 3
      storageMinimalAvailablePercentage: 25
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 3
      reclaimPolicy: Delete
    service:
      ui:
        type: ClusterIP
    ingress:
      enabled: false
    # Explicitly empty tolerations: Longhorn runs on workers only (control-plane has
    # NoSchedule taint). This overrides any future chart default changes safely.
    longhornManager:
      tolerations: []
    longhornDriver:
      tolerations: []
