apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: dex
spec:
  interval: 10m
  releaseName: dex
  targetNamespace: dex
  chart:
    spec:
      chart: dex
      # Keep in sync with Taskfile.yml DEX_VERSION
      version: "0.24.0"
      sourceRef:
        kind: HelmRepository
        name: dexidp
        namespace: dex
      interval: 12h
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    replicaCount: 2
    envFrom:
      - secretRef:
          name: dex-github-client
    config:
      issuer: https://dex.yh.k8s.tsuru.run
      storage:
        type: kubernetes
        config:
          inCluster: true
      enablePasswordDB: false
      oauth2:
        skipApprovalScreen: true
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $GITHUB_CLIENT_ID
            clientSecret: $GITHUB_CLIENT_SECRET
            redirectURI: https://dex.yh.k8s.tsuru.run/callback
      staticClients:
        - id: kubelogin
          name: kubelogin
          public: true
          redirectURIs:
            - http://localhost:8000
            - http://localhost:18000
    service:
      type: ClusterIP
    ingress:
      enabled: false
