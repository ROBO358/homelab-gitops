apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: yh-cluster
      integrationInfo:
        name: eso
        # version is recorded in 1Password audit logs as integration metadata; value is arbitrary
        version: v1.0.0
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          namespace: external-secrets
          key: token
