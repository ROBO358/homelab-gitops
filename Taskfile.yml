version: '3'

vars:
  EXPECTED_CONTEXT: admin@yh-cluster
  FLUX_NS: flux-system
  CILIUM_NS: kube-system
  # Keep in sync with yh-talos Taskfile.yml CILIUM_VERSION
  CILIUM_VERSION: "1.19.2"
  # Keep in sync with infrastructure/gateway-api-crds/kustomization.yaml URLs
  GATEWAY_API_VERSION: "1.4.1"
  # Keep in sync with infrastructure/external-secrets/controller/helmrelease.yaml
  ESO_NS: external-secrets
  ESO_VERSION: "2.3.0"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  ctx:check:
    desc: "Verify kube context is admin@yh-cluster"
    silent: true
    cmds:
      - |
        current=$(kubectl config current-context)
        if [ "$current" != "{{.EXPECTED_CONTEXT}}" ]; then
          echo "ERROR: current context='$current', expected='{{.EXPECTED_CONTEXT}}'" >&2
          exit 1
        fi

  # ────────────────────────────────
  # flux: Flux lifecycle
  # ────────────────────────────────

  flux:bootstrap:
    desc: "Bootstrap Flux via GitHub (creates deploy key, run after cluster rebuild)"
    deps: [ctx:check]
    prompt: "This runs flux bootstrap github and commits to main. Continue?"
    cmds:
      - |
        GITHUB_TOKEN=$(gh auth token) flux bootstrap github \
          --owner=ROBO358 \
          --repository=homelab-gitops \
          --branch=main \
          --path=clusters/yh-cluster \
          --personal

  flux:status:
    desc: "Show Flux sources / kustomizations / helmreleases status"
    deps: [ctx:check]
    cmds:
      - flux get sources git -A
      - flux get kustomizations -A
      - flux get helmreleases -A || true

  flux:reconcile:
    desc: "Force Flux to pull latest main and reconcile"
    deps: [ctx:check]
    cmds:
      - flux reconcile source git flux-system
      - flux reconcile kustomization flux-system

  flux:logs:
    desc: "Tail Flux controllers error logs"
    deps: [ctx:check]
    cmds:
      - flux logs --all-namespaces --follow --level=error

  flux:uninstall:
    desc: "Remove Flux from the cluster (emergency use)"
    deps: [ctx:check]
    prompt: "This deletes flux-system namespace and all Flux resources. Continue?"
    cmds:
      - flux uninstall --namespace {{.FLUX_NS}} --silent

  # ────────────────────────────────
  # cilium: cilium operations
  # ────────────────────────────────

  cilium:restart:
    desc: "Rolling restart Cilium DaemonSet (needed after ConfigMap-only Helm upgrades)"
    deps: [ctx:check]
    prompt: "This rolling-restarts all Cilium pods (brief per-node connectivity blip). Continue?"
    cmds:
      - kubectl -n {{.CILIUM_NS}} rollout restart ds/cilium
      - kubectl -n {{.CILIUM_NS}} rollout status ds/cilium --timeout=5m

  cilium:restart-all:
    desc: "Restart Cilium DaemonSet + Operator (needed after ConfigMap-only Helm upgrades affecting both)"
    deps: [ctx:check]
    prompt: "This rolling-restarts all Cilium pods and the operator. Continue?"
    cmds:
      - kubectl -n {{.CILIUM_NS}} rollout restart ds/cilium deploy/cilium-operator
      - kubectl -n {{.CILIUM_NS}} rollout status ds/cilium --timeout=5m
      - kubectl -n {{.CILIUM_NS}} rollout status deploy/cilium-operator --timeout=2m

  # ────────────────────────────────
  # eso: External Secrets Operator lifecycle
  # ────────────────────────────────

  eso:bootstrap-secret:
    desc: "Create onepassword-token Secret from 1Password (run once after cluster rebuild)"
    deps: [ctx:check]
    prompt: "This reads op://Private/Service Account Auth Token: yh-cluster/認証情報 via op CLI and creates a Secret in external-secrets namespace. Continue?"
    cmds:
      - kubectl create namespace {{.ESO_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - |
        token=$(op read "op://Private/Service Account Auth Token: yh-cluster/認証情報")
        if [ -z "$token" ]; then
          echo "ERROR: op read returned empty token. Run 'op signin' first." >&2
          exit 1
        fi
        kubectl create secret generic onepassword-token \
          -n {{.ESO_NS}} \
          --from-literal=token="$token" \
          --dry-run=client -o yaml | kubectl apply -f -

  verify:eso:
    desc: "ESO pods + ClusterSecretStore status"
    deps: [ctx:check]
    cmds:
      - kubectl -n {{.ESO_NS}} get pod
      - kubectl get clustersecretstore
      - |
        echo "== onepassword ClusterSecretStore Ready status =="
        kubectl get clustersecretstore onepassword \
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}{"\n"}'

  test:eso:
    desc: "E2E: ExternalSecret for yh-cluster/eso-smoke-test item -> Secret, verify, cleanup"
    deps: [ctx:check]
    # Prereq: 1Password yh-cluster vault に Password タイプの "eso-smoke-test" item を作成し
    #         built-in の password フィールドに任意の文字列を設定しておく（カスタムフィールド不要）
    cmds:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: eso-smoke-test
          namespace: default
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: onepassword
          target:
            name: eso-smoke-test
          data:
            - secretKey: value
              remoteRef:
                key: eso-smoke-test
                property: password
        EOF
      - |
        echo "Waiting for Secret default/eso-smoke-test (up to 60s)..."
        for i in $(seq 1 30); do
          val=$(kubectl -n default get secret eso-smoke-test \
                -o jsonpath='{.data.value}' 2>/dev/null | base64 -d 2>/dev/null)
          if [ -n "$val" ]; then
            echo "Secret synced: value=$val"
            break
          fi
          sleep 2
        done
        if [ -z "$val" ]; then
          echo "Timed out. Check: kubectl describe externalsecret eso-smoke-test" >&2
          kubectl -n default describe externalsecret eso-smoke-test 2>/dev/null | tail -20 >&2
          exit 1
        fi
      - defer: kubectl -n default delete externalsecret,secret eso-smoke-test --ignore-not-found

  # ────────────────────────────────
  # gateway: Gateway API operations
  # ────────────────────────────────

  verify:gateway:
    desc: "Gateway API CRDs, GatewayClass, envoy DS status"
    deps: [ctx:check]
    cmds:
      - kubectl get crd | grep gateway.networking.k8s.io
      - kubectl get gatewayclass
      - kubectl -n {{.CILIUM_NS}} get ds cilium-envoy

  test:gateway:
    desc: "Deploy nginx + Gateway + HTTPRoute, verify EXTERNAL-IP, curl, cleanup"
    deps: [ctx:check]
    cmds:
      - kubectl create deployment nginx-gwtest --image=nginx
      - kubectl rollout status deployment/nginx-gwtest --timeout=60s
      - kubectl expose deployment nginx-gwtest --port=80
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: gwtest
          namespace: default
        spec:
          gatewayClassName: cilium
          listeners:
            - name: http
              port: 80
              protocol: HTTP
        ---
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: gwtest
          namespace: default
        spec:
          parentRefs: [{name: gwtest}]
          rules:
            - backendRefs:
                - name: nginx-gwtest
                  port: 80
        EOF
      - |
        echo "Waiting for Gateway EXTERNAL-IP (up to 60s)..."
        for i in $(seq 1 30); do
          ip=$(kubectl get gateway gwtest -o jsonpath='{.status.addresses[0].value}' 2>/dev/null)
          if [ -n "$ip" ]; then
            echo "EXTERNAL-IP: $ip"
            curl -sI "http://$ip" | head -1
            break
          fi
          sleep 2
        done
        if [ -z "$ip" ]; then
          echo "Timed out waiting for Gateway EXTERNAL-IP" >&2
          exit 1
        fi
      - defer: kubectl delete gateway,httproute gwtest --ignore-not-found
      - defer: kubectl delete deployment,svc nginx-gwtest --ignore-not-found

  # ────────────────────────────────
  # verify: cluster / cilium state
  # ────────────────────────────────

  verify:cluster:
    desc: "Show nodes and key system pods"
    deps: [ctx:check]
    cmds:
      - kubectl get nodes -o wide
      - kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=cilium
      - kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=kube-dns

  verify:cilium:
    desc: "Cilium adoption annotation / status / feature flags"
    deps: [ctx:check]
    cmds:
      - |
        pod=$(kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=cilium -o name | head -1)
        echo "== adoption annotation =="
        kubectl -n {{.CILIUM_NS}} get ds cilium \
          -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}{"\n"}'
        echo "== cilium status =="
        kubectl -n {{.CILIUM_NS}} exec "$pod" -c cilium-agent -- cilium status --brief
        echo "== feature flags (cilium-config) =="
        kubectl -n {{.CILIUM_NS}} get cm cilium-config -o yaml \
          | grep -E 'enable-l2-announcements|enable-wireguard|enable-envoy-config|kube-proxy-replacement'

  verify:encryption:
    desc: "WireGuard encryption status"
    deps: [ctx:check]
    cmds:
      - |
        pod=$(kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=cilium -o name | head -1)
        kubectl -n {{.CILIUM_NS}} exec "$pod" -c cilium-agent -- cilium encrypt status

  verify:hubble:
    desc: "Hubble Relay and UI pod status"
    deps: [ctx:check]
    cmds:
      - kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=hubble-relay
      - kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=hubble-ui

  verify:l2:
    desc: "Cilium L2 IP pool, announcement policy, elected node lease, and agent state"
    deps: [ctx:check]
    cmds:
      - kubectl get ciliumloadbalancerippool
      - kubectl get ciliuml2announcementpolicy
      - |
        echo "== L2 announcement leases (elected nodes per service) =="
        kubectl get lease -n {{.CILIUM_NS}} | grep l2announce || echo "(none — no LoadBalancer services or L2 not active)"
      - |
        echo "== l2-announce StateDB on each worker =="
        for pod in $(kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=cilium -o name); do
          node=$(kubectl -n {{.CILIUM_NS}} get "$pod" -o jsonpath='{.spec.nodeName}')
          entries=$(kubectl -n {{.CILIUM_NS}} exec "$pod" -c cilium-agent -- \
            cilium-dbg statedb dump 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('l2-announce',[]))" 2>/dev/null)
          echo "  $node: $entries"
        done

  # ────────────────────────────────
  # test: end-to-end smoke tests
  # ────────────────────────────────

  test:lb:
    desc: "Deploy temporary nginx LoadBalancer service, verify EXTERNAL-IP, then clean up"
    deps: [ctx:check]
    cmds:
      - kubectl create deployment nginx-lbtest --image=nginx
      - kubectl expose deployment nginx-lbtest --port=80 --type=LoadBalancer
      - |
        echo "Waiting for EXTERNAL-IP (up to 60s)..."
        for i in $(seq 1 30); do
          ip=$(kubectl get svc nginx-lbtest \
               -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$ip" ]; then
            echo "EXTERNAL-IP: $ip"
            curl -sI "http://$ip" | head -2
            break
          fi
          sleep 2
        done
        if [ -z "$ip" ]; then
          echo "Timed out waiting for EXTERNAL-IP" >&2
          exit 1
        fi
      - defer: kubectl delete deployment,svc nginx-lbtest --ignore-not-found
