version: "3"

vars:
  EXPECTED_CONTEXT: admin@yh-cluster
  FLUX_NS: flux-system
  CILIUM_NS: kube-system
  # Keep in sync with yh-talos Taskfile.yml CILIUM_VERSION
  CILIUM_VERSION: "1.19.2"
  # Keep in sync with infrastructure/gateway-api-crds/kustomization.yaml URLs
  GATEWAY_API_VERSION: "1.4.1"
  # Keep in sync with infrastructure/external-secrets/controller/helmrelease.yaml
  ESO_NS: external-secrets
  ESO_VERSION: "2.3.0"
  # Keep in sync with infrastructure/longhorn/controller/helmrelease.yaml
  LONGHORN_NS: longhorn-system
  LONGHORN_VERSION: "1.11.1"
  # Keep in sync with infrastructure/cert-manager/controller/helmrelease.yaml
  CM_NS: cert-manager
  CM_VERSION: "v1.16.2"
  # Keep in sync with infrastructure/dex/controller/helmrelease.yaml
  DEX_NS: dex
  DEX_VERSION: "0.24.0"
  DEX_HOST: "dex.yh.k8s.tsuru.run"
  # WSL2: op (Linux) may not be installed; fall back to op.exe (Windows 1Password CLI)
  OP_CMD:
    sh: command -v op >/dev/null 2>&1 && echo "op" || echo "op.exe"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  ctx:check:
    desc: "Verify kube context is admin@yh-cluster"
    silent: true
    cmds:
      - |
        current=$(kubectl config current-context)
        if [ "$current" != "{{.EXPECTED_CONTEXT}}" ]; then
          echo "ERROR: current context='$current', expected='{{.EXPECTED_CONTEXT}}'" >&2
          exit 1
        fi

  # ────────────────────────────────
  # flux: Flux lifecycle
  # ────────────────────────────────

  flux:bootstrap:
    desc: "Bootstrap Flux via GitHub (creates deploy key, run after cluster rebuild)"
    deps: [ctx:check]
    prompt: "This runs flux bootstrap github and commits to main. Continue?"
    cmds:
      - |
        GITHUB_TOKEN=$(gh auth token) flux bootstrap github \
          --owner=ROBO358 \
          --repository=homelab-gitops \
          --branch=main \
          --path=clusters/yh-cluster \
          --personal

  flux:status:
    desc: "Show Flux sources / kustomizations / helmreleases status"
    deps: [ctx:check]
    cmds:
      - flux get sources git -A
      - flux get kustomizations -A
      - flux get helmreleases -A || true

  flux:reconcile:
    desc: "Force Flux to pull latest main and reconcile"
    deps: [ctx:check]
    cmds:
      - flux reconcile source git flux-system
      - flux reconcile kustomization flux-system

  flux:logs:
    desc: "Tail Flux controllers error logs"
    deps: [ctx:check]
    cmds:
      - flux logs --all-namespaces --follow --level=error

  flux:uninstall:
    desc: "Remove Flux from the cluster (emergency use)"
    deps: [ctx:check]
    prompt: "This deletes flux-system namespace and all Flux resources. Continue?"
    cmds:
      - flux uninstall --namespace {{.FLUX_NS}} --silent

  # ────────────────────────────────
  # cilium: cilium operations
  # ────────────────────────────────

  cilium:restart:
    desc: "Rolling restart Cilium DaemonSet (needed after ConfigMap-only Helm upgrades)"
    deps: [ctx:check]
    prompt: "This rolling-restarts all Cilium pods (brief per-node connectivity blip). Continue?"
    cmds:
      - kubectl -n {{.CILIUM_NS}} rollout restart ds/cilium
      - kubectl -n {{.CILIUM_NS}} rollout status ds/cilium --timeout=5m

  cilium:restart-all:
    desc: "Restart Cilium DaemonSet + Operator (needed after ConfigMap-only Helm upgrades affecting both)"
    deps: [ctx:check]
    prompt: "This rolling-restarts all Cilium pods and the operator. Continue?"
    cmds:
      - kubectl -n {{.CILIUM_NS}} rollout restart ds/cilium deploy/cilium-operator
      - kubectl -n {{.CILIUM_NS}} rollout status ds/cilium --timeout=5m
      - kubectl -n {{.CILIUM_NS}} rollout status deploy/cilium-operator --timeout=2m

  # ────────────────────────────────
  # admin: Break-Glass admin access via 1Password
  # ────────────────────────────────

  admin:save-kubeconfig:
    desc: "Save current admin@yh-cluster kubeconfig to 1Password yh-cluster vault (run after credential rotation)"
    prompt: "This will overwrite the break-glass kubeconfig in 1Password with the current admin@yh-cluster credentials. Make sure the credentials are valid before proceeding. Continue?"
    cmds:
      - |
        kubectl config view --context=admin@yh-cluster --minify --raw -o yaml > /tmp/break-glass-kubeconfig.yaml
        if {{.OP_CMD}} document get "yh-cluster-break-glass-kubeconfig" --vault yh-cluster >/dev/null 2>&1; then
          {{.OP_CMD}} document edit "yh-cluster-break-glass-kubeconfig" /tmp/break-glass-kubeconfig.yaml --vault yh-cluster
          echo "Updated: yh-cluster-break-glass-kubeconfig in 1Password (yh-cluster vault)"
        else
          {{.OP_CMD}} document create /tmp/break-glass-kubeconfig.yaml \
            --vault yh-cluster \
            --title "yh-cluster-break-glass-kubeconfig"
          echo "Created: yh-cluster-break-glass-kubeconfig in 1Password (yh-cluster vault)"
        fi
        rm -f /tmp/break-glass-kubeconfig.yaml

  admin:break-glass:
    desc: "Retrieve admin kubeconfig from 1Password and merge into ~/.kube/config (emergency use only)"
    prompt: "This will write admin credentials from 1Password to /tmp/break-glass-kubeconfig.yaml and merge into ~/.kube/config. Continue?"
    cmds:
      - |
        {{.OP_CMD}} document get "yh-cluster-break-glass-kubeconfig" --vault yh-cluster \
          > /tmp/break-glass-kubeconfig.yaml || {
          echo "ERROR: could not retrieve kubeconfig from 1Password." >&2
          echo "Run '{{.OP_CMD}} signin' first, or use: talosctl kubeconfig --talosconfig ~/k8s/talhelper/clusterconfig/talosconfig" >&2
          exit 1
        }
        KUBECONFIG=~/.kube/config:/tmp/break-glass-kubeconfig.yaml \
          kubectl config view --flatten > /tmp/merged-kubeconfig.yaml
        mv /tmp/merged-kubeconfig.yaml ~/.kube/config
        chmod 600 ~/.kube/config
        rm -f /tmp/break-glass-kubeconfig.yaml
        echo "Merged admin@yh-cluster into ~/.kube/config"
        echo "Switch context: kubectl config use-context admin@yh-cluster"
        echo "Restore OIDC:   kubectl config use-context oidc@yh-cluster"

  admin:verify-break-glass:
    desc: "Verify break-glass kubeconfig exists in 1Password and is retrievable"
    cmds:
      - |
        echo "== Checking 1Password document =="
        if {{.OP_CMD}} document get "yh-cluster-break-glass-kubeconfig" --vault yh-cluster \
            | grep -q "server:"; then
          echo "PASS: break-glass kubeconfig exists and contains server URL"
        else
          echo "FAIL: break-glass kubeconfig not found or invalid" >&2
          exit 1
        fi
        echo ""
        echo "Break-glass procedure:"
        echo "  task admin:break-glass"
        echo "  kubectl config use-context admin@yh-cluster"
        echo ""
        echo "Alternative (no 1Password):"
        echo "  talosctl kubeconfig --talosconfig ~/k8s/talhelper/clusterconfig/talosconfig"

  admin:delete-local-admin:
    desc: "Delete all admin contexts/users from ~/.kube/config (run after break-glass is confirmed in 1Password)"
    prompt: "This will permanently delete all admin contexts and users from ~/.kube/config and switch to oidc@yh-cluster. Confirm break-glass is in 1Password (task admin:verify-break-glass) before proceeding. Continue?"
    cmds:
      - |
        # Switch to OIDC first so we don't delete the current context
        kubectl config use-context oidc@yh-cluster
        # Delete all contexts whose name starts with "admin@"
        for ctx in $(kubectl config get-contexts -o name | grep '^admin@'); do
          kubectl config delete-context "$ctx" && echo "Deleted context: $ctx"
        done
        # Delete all users whose name starts with "admin@"
        for user in $(kubectl config get-users | grep '^admin@'); do
          kubectl config delete-user "$user" && echo "Deleted user: $user"
        done
        echo ""
        echo "Current context: $(kubectl config current-context)"
        echo "Remaining contexts:"
        kubectl config get-contexts

  # ────────────────────────────────
  # eso: External Secrets Operator lifecycle
  # ────────────────────────────────

  eso:bootstrap-secret:
    desc: "Create onepassword-token Secret from 1Password (run once after cluster rebuild)"
    deps: [ctx:check]
    prompt: "This reads op://Private/Service Account Auth Token: yh-cluster/認証情報 via op CLI and creates a Secret in external-secrets namespace. Continue?"
    cmds:
      - kubectl create namespace {{.ESO_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - |
        token=$({{.OP_CMD}} item get "Service Account Auth Token: yh-cluster" \
          --vault "Private" --fields "認証情報" --reveal) || {
          echo "ERROR: op exited non-zero. Run '{{.OP_CMD}} signin' first." >&2
          exit 1
        }
        if [ -z "$token" ]; then
          echo "ERROR: op returned empty token." >&2
          exit 1
        fi
        kubectl create secret generic onepassword-token \
          -n {{.ESO_NS}} \
          --from-literal=token="$token" \
          --dry-run=client -o yaml | kubectl apply -f -

  verify:eso:
    desc: "ESO pods + ClusterSecretStore status"
    deps: [ctx:check]
    cmds:
      - kubectl -n {{.ESO_NS}} get pod
      - kubectl get clustersecretstore
      - |
        echo "== onepassword ClusterSecretStore Ready status =="
        kubectl get clustersecretstore onepassword \
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}{"\n"}'

  test:eso:
    desc: "E2E: ExternalSecret for yh-cluster/eso-smoke-test item -> Secret, verify, cleanup"
    deps: [ctx:check]
    # Prereq: 1Password yh-cluster vault に Password タイプの "eso-smoke-test" item を作成し
    #         password フィールドに任意の文字列を設定しておく
    # Note: dataFrom.extract を使用（全フィールドを一括取得）
    #       Secret のキーは 1Password のフィールドラベルと一致する（例: password）
    cmds:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: eso-smoke-test
          namespace: default
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: onepassword
          target:
            name: eso-smoke-test
          dataFrom:
            - extract:
                key: eso-smoke-test
        EOF
      - |
        echo "Waiting for Secret default/eso-smoke-test (up to 60s)..."
        for i in $(seq 1 30); do
          val=$(kubectl -n default get secret eso-smoke-test \
                -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null)
          if [ -n "$val" ]; then
            echo "Secret synced: password=$val"
            break
          fi
          sleep 2
        done
        if [ -z "$val" ]; then
          echo "Timed out. Check: kubectl describe externalsecret eso-smoke-test" >&2
          kubectl -n default describe externalsecret eso-smoke-test 2>/dev/null | tail -20 >&2
          exit 1
        fi
      - defer: kubectl -n default delete externalsecret,secret eso-smoke-test --ignore-not-found

  # ────────────────────────────────
  # longhorn: Longhorn storage lifecycle
  # ────────────────────────────────

  longhorn:ui:
    desc: "Port-forward Longhorn UI to http://localhost:8080 (Ctrl-C to stop)"
    deps: [ctx:check]
    cmds:
      - |
        echo "Longhorn UI: http://localhost:8080"
        kubectl -n {{.LONGHORN_NS}} port-forward svc/longhorn-frontend 8080:80

  verify:longhorn:
    desc: "Longhorn manager/CSI pods, StorageClass, and node disk status"
    deps: [ctx:check]
    cmds:
      - kubectl -n {{.LONGHORN_NS}} get pod
      - kubectl get storageclass
      - kubectl -n {{.LONGHORN_NS}} get nodes.longhorn.io

  test:longhorn:
    desc: "E2E: create PVC -> mount in pod -> write/read file -> cleanup"
    deps: [ctx:check]
    cmds:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: longhorn-smoke-test
          namespace: default
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
        ---
        apiVersion: v1
        kind: Pod
        metadata:
          name: longhorn-smoke-test
          namespace: default
        spec:
          restartPolicy: Never
          containers:
            - name: writer
              image: busybox:1.36
              command: ["sh","-c","echo hello-longhorn > /data/test.txt && cat /data/test.txt && sleep 5"]
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: longhorn-smoke-test
        EOF
      - kubectl -n default wait --for=condition=ContainersReady pod/longhorn-smoke-test --timeout=120s
      - |
        echo "== Pod logs =="
        kubectl -n default logs longhorn-smoke-test
      - defer: kubectl -n default delete pod,pvc longhorn-smoke-test --ignore-not-found

  # ────────────────────────────────
  # cert-manager: certificate automation
  # ────────────────────────────────

  verify:cert-manager:
    desc: "cert-manager pods + ClusterIssuers Ready status"
    deps: [ctx:check]
    cmds:
      - kubectl -n {{.CM_NS}} get pod
      - kubectl get clusterissuer
      - |
        echo "== ClusterIssuer Ready status =="
        for issuer in letsencrypt-staging letsencrypt-prod; do
          status=$(kubectl get clusterissuer "$issuer" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
          echo "  $issuer: ${status:-NotFound}"
        done

  test:cert-manager:
    desc: "E2E: issue cert with letsencrypt-staging (DNS-01 Cloudflare), verify, cleanup"
    deps: [ctx:check]
    # DNS-01 challenge: usually 1-3 min, max 6 min for DNS propagation
    cmds:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: cm-smoke
          namespace: default
        spec:
          secretName: cm-smoke-tls
          commonName: smoke.yh.k8s.tsuru.run
          dnsNames: [smoke.yh.k8s.tsuru.run]
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-staging
          duration: 2160h
        EOF
      - |
        echo "Waiting for Certificate Ready (up to 6 min for DNS-01)..."
        for i in $(seq 1 60); do
          ready=$(kubectl -n default get certificate cm-smoke \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
          [ "$ready" = "True" ] && { echo "Ready"; break; }
          sleep 6
        done
        if [ "$ready" != "True" ]; then
          echo "Timed out"
          kubectl -n default describe certificate cm-smoke
          kubectl -n default get challenges 2>/dev/null | tail -5
          exit 1
        fi
      - |
        echo "== 発行された証明書 =="
        kubectl -n default get secret cm-smoke-tls \
          -o jsonpath='{.data.tls\.crt}' | base64 -d \
          | openssl x509 -noout -subject -issuer -dates
        echo "(issuer が '(STAGING) Let'\''s Encrypt' 系なら成功)"
      - defer: kubectl -n default delete certificate,secret cm-smoke cm-smoke-tls --ignore-not-found

  # ────────────────────────────────
  # dex: OIDC bridge lifecycle
  # ────────────────────────────────

  verify:dex:
    desc: "Dex pods, Certificate, Gateway, HTTPRoute status"
    deps: [ctx:check]
    cmds:
      - kubectl -n {{.DEX_NS}} get pod
      - kubectl -n {{.DEX_NS}} get certificate,gateway,httproute
      - |
        echo "== Certificate Ready status =="
        kubectl -n {{.DEX_NS}} get certificate dex-tls \
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}{"\n"}'
      - |
        echo "== Gateway LB IP =="
        kubectl -n {{.DEX_NS}} get gateway dex-gateway \
          -o jsonpath='{.status.addresses[0].value}{"\n"}'

  test:dex:
    desc: "E2E: OIDC discovery endpoint returns valid JSON with browser-trusted cert"
    deps: [ctx:check]
    # Prereq: Cloudflare で dex.yh.k8s.tsuru.run A 192.168.1.100 (proxy OFF) が登録済み
    cmds:
      - |
        echo "== OIDC discovery document =="
        curl -sS --fail "https://{{.DEX_HOST}}/.well-known/openid-configuration" \
          | python3 -m json.tool
      - |
        echo "== TLS cert issuer (should be 'Let'\''s Encrypt' — NOT STAGING) =="
        echo | openssl s_client -servername {{.DEX_HOST}} -connect {{.DEX_HOST}}:443 2>/dev/null \
          | openssl x509 -noout -subject -issuer -dates

  # ────────────────────────────────
  # oidc: OIDC kubeconfig + verification
  # ────────────────────────────────

  oidc:setup:
    desc: "Configure local kubeconfig to use Dex OIDC (requires: kubectl krew install oidc-login)"
    prompt: "This adds 'oidc' user and 'oidc@yh-cluster' context to your kubeconfig. Continue?"
    cmds:
      - |
        if ! kubectl oidc-login --help >/dev/null 2>&1; then
          echo "ERROR: kubectl oidc-login plugin not found." >&2
          echo "Install: kubectl krew install oidc-login" >&2
          exit 1
        fi
      - |
        kubectl config set-credentials oidc \
          --exec-api-version=client.authentication.k8s.io/v1beta1 \
          --exec-command=kubectl \
          --exec-arg=oidc-login \
          --exec-arg=get-token \
          --exec-arg=--oidc-issuer-url=https://dex.yh.k8s.tsuru.run \
          --exec-arg=--oidc-client-id=kubelogin \
          --exec-arg=--oidc-extra-scope=email \
          --exec-arg=--oidc-extra-scope=profile \
          --exec-arg=--oidc-extra-scope=groups \
          --exec-arg=--grant-type=authcode-keyboard
      - |
        kubectl config set-context oidc@yh-cluster \
          --cluster=yh-cluster \
          --user=oidc
      - |
        echo "Switch with: kubectl config use-context oidc@yh-cluster"

  verify:oidc:
    desc: "Show OIDC ClusterRoleBindings and kube-apiserver OIDC flags"
    deps: [ctx:check]
    cmds:
      - kubectl get clusterrolebinding -l auth-source=oidc -o wide
      - |
        echo "== kube-apiserver OIDC flags =="
        kubectl -n kube-system get pod -l component=kube-apiserver \
          -o jsonpath='{.items[0].spec.containers[0].command}' \
          | tr ',' '\n' | grep oidc \
          || echo "(not applied yet — did you run talosctl apply-config?)"

  test:oidc:
    desc: "E2E via oidc@yh-cluster: get pod (allowed) + get secret (forbidden) + create (forbidden)"
    cmds:
      - |
        current=$(kubectl config current-context)
        trap "kubectl config use-context $current" EXIT
        kubectl config use-context oidc@yh-cluster

        echo "== get pod -A (should succeed with 'view') =="
        kubectl get pod -A | head -5

        echo "== get secret -A (should be Forbidden) =="
        if kubectl get secret -A 2>&1 | tee /dev/stderr | grep -q 'Forbidden\|forbidden'; then
          echo "PASS: Secret access denied"
        else
          echo "FAIL: Secret access should have been denied" >&2
          exit 1
        fi

        echo "== create deployment (should be Forbidden) =="
        if kubectl create deployment oidc-test --image=nginx 2>&1 | grep -q 'Forbidden\|forbidden'; then
          echo "PASS: create denied"
        else
          kubectl delete deployment oidc-test --ignore-not-found
          echo "FAIL: create should have been denied" >&2
          exit 1
        fi

  # ────────────────────────────────
  # gateway: Gateway API operations
  # ────────────────────────────────

  verify:gateway:
    desc: "Gateway API CRDs, GatewayClass, envoy DS status"
    deps: [ctx:check]
    cmds:
      - kubectl get crd | grep gateway.networking.k8s.io
      - kubectl get gatewayclass
      - kubectl -n {{.CILIUM_NS}} get ds cilium-envoy

  test:gateway:
    desc: "Deploy nginx + Gateway + HTTPRoute, verify EXTERNAL-IP, curl, cleanup"
    deps: [ctx:check]
    cmds:
      - kubectl create deployment nginx-gwtest --image=nginx
      - kubectl rollout status deployment/nginx-gwtest --timeout=60s
      - kubectl expose deployment nginx-gwtest --port=80
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: gwtest
          namespace: default
        spec:
          gatewayClassName: cilium
          listeners:
            - name: http
              port: 80
              protocol: HTTP
        ---
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: gwtest
          namespace: default
        spec:
          parentRefs: [{name: gwtest}]
          rules:
            - backendRefs:
                - name: nginx-gwtest
                  port: 80
        EOF
      - |
        echo "Waiting for Gateway EXTERNAL-IP (up to 60s)..."
        for i in $(seq 1 30); do
          ip=$(kubectl get gateway gwtest -o jsonpath='{.status.addresses[0].value}' 2>/dev/null)
          if [ -n "$ip" ]; then
            echo "EXTERNAL-IP: $ip"
            curl -sI "http://$ip" | head -1
            break
          fi
          sleep 2
        done
        if [ -z "$ip" ]; then
          echo "Timed out waiting for Gateway EXTERNAL-IP" >&2
          exit 1
        fi
      - defer: kubectl delete gateway,httproute gwtest --ignore-not-found
      - defer: kubectl delete deployment,svc nginx-gwtest --ignore-not-found

  # ────────────────────────────────
  # verify: cluster / cilium state
  # ────────────────────────────────

  verify:cluster:
    desc: "Show nodes and key system pods"
    deps: [ctx:check]
    cmds:
      - kubectl get nodes -o wide
      - kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=cilium
      - kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=kube-dns

  verify:cilium:
    desc: "Cilium adoption annotation / status / feature flags"
    deps: [ctx:check]
    cmds:
      - |
        pod=$(kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=cilium -o name | head -1)
        echo "== adoption annotation =="
        kubectl -n {{.CILIUM_NS}} get ds cilium \
          -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}{"\n"}'
        echo "== cilium status =="
        kubectl -n {{.CILIUM_NS}} exec "$pod" -c cilium-agent -- cilium status --brief
        echo "== feature flags (cilium-config) =="
        kubectl -n {{.CILIUM_NS}} get cm cilium-config -o yaml \
          | grep -E 'enable-l2-announcements|enable-wireguard|enable-envoy-config|kube-proxy-replacement'

  verify:encryption:
    desc: "WireGuard encryption status"
    deps: [ctx:check]
    cmds:
      - |
        pod=$(kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=cilium -o name | head -1)
        kubectl -n {{.CILIUM_NS}} exec "$pod" -c cilium-agent -- cilium encrypt status

  verify:hubble:
    desc: "Hubble Relay and UI pod status"
    deps: [ctx:check]
    cmds:
      - kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=hubble-relay
      - kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=hubble-ui

  verify:l2:
    desc: "Cilium L2 IP pool, announcement policy, elected node lease, and agent state"
    deps: [ctx:check]
    cmds:
      - kubectl get ciliumloadbalancerippool
      - kubectl get ciliuml2announcementpolicy
      - |
        echo "== L2 announcement leases (elected nodes per service) =="
        kubectl get lease -n {{.CILIUM_NS}} | grep l2announce || echo "(none — no LoadBalancer services or L2 not active)"
      - |
        echo "== l2-announce StateDB on each worker =="
        for pod in $(kubectl -n {{.CILIUM_NS}} get pod -l k8s-app=cilium -o name); do
          node=$(kubectl -n {{.CILIUM_NS}} get "$pod" -o jsonpath='{.spec.nodeName}')
          entries=$(kubectl -n {{.CILIUM_NS}} exec "$pod" -c cilium-agent -- \
            cilium-dbg statedb dump 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('l2-announce',[]))" 2>/dev/null)
          echo "  $node: $entries"
        done

  # ────────────────────────────────
  # test: end-to-end smoke tests
  # ────────────────────────────────

  test:lb:
    desc: "Deploy temporary nginx LoadBalancer service, verify EXTERNAL-IP, then clean up"
    deps: [ctx:check]
    cmds:
      - kubectl create deployment nginx-lbtest --image=nginx
      - kubectl expose deployment nginx-lbtest --port=80 --type=LoadBalancer
      - |
        echo "Waiting for EXTERNAL-IP (up to 60s)..."
        for i in $(seq 1 30); do
          ip=$(kubectl get svc nginx-lbtest \
               -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$ip" ]; then
            echo "EXTERNAL-IP: $ip"
            curl -sI "http://$ip" | head -2
            break
          fi
          sleep 2
        done
        if [ -z "$ip" ]; then
          echo "Timed out waiting for EXTERNAL-IP" >&2
          exit 1
        fi
      - defer: kubectl delete deployment,svc nginx-lbtest --ignore-not-found

  # ────────────────────────────────
  # flux-rbac: RBAC Phase B verification
  # ────────────────────────────────

  verify:flux-rbac:
    desc: "Flux SA + ClusterRoleBinding 一覧確認"
    deps: [ctx:check]
    cmds:
      - kubectl get serviceaccount -A -l app.kubernetes.io/part-of=flux-rbac
      - kubectl get clusterrolebinding -l app.kubernetes.io/part-of=flux-rbac
      - kubectl get kustomization -n flux-system -o custom-columns=NAME:.metadata.name,SA:.spec.serviceAccountName
      - kubectl get helmrelease -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,SA:.spec.serviceAccountName
      - kubectl auth can-i impersonate serviceaccount --as=system:serviceaccount:flux-system:kustomize-controller -n flux-system
      - kubectl auth can-i impersonate serviceaccount --as=system:serviceaccount:flux-system:helm-controller -n kube-system

  test:flux-rbac:
    desc: "Flux/helm SA が cluster-admin を持たないことを包括確認"
    deps: [ctx:check]
    cmds:
      - |
        fail=0

        check_no_admin() {
          local desc="$1" as="$2"
          # Use "create nodes" as proxy: cluster-admin can, scoped helm-* roles cannot
          if kubectl auth can-i create nodes --as="$as" 2>&1 | grep -q yes; then
            echo "FAIL: $desc still has cluster-admin (can create nodes)"
            fail=1
          else
            echo "PASS: $desc does NOT have cluster-admin"
          fi
        }

        check_can_impersonate() {
          local desc="$1" as="$2" ns="$3"
          if kubectl auth can-i impersonate serviceaccount --as="$as" -n "$ns" 2>&1 | grep -q yes; then
            echo "PASS: $desc CAN impersonate (expected)"
          else
            echo "FAIL: $desc CANNOT impersonate"
            fail=1
          fi
        }

        echo "=== Flux controllers ==="
        check_no_admin "kustomize-controller" "system:serviceaccount:flux-system:kustomize-controller"
        check_can_impersonate "kustomize-controller" "system:serviceaccount:flux-system:kustomize-controller" "flux-system"
        check_no_admin "helm-controller" "system:serviceaccount:flux-system:helm-controller"
        check_can_impersonate "helm-controller" "system:serviceaccount:flux-system:helm-controller" "kube-system"

        echo ""
        echo "=== Flux controller Kustomization SAs ==="
        for sa in flux-cilium flux-external-secrets flux-longhorn flux-cert-manager flux-dex; do
          check_no_admin "$sa" "system:serviceaccount:flux-system:$sa"
        done

        echo ""
        echo "=== Helm chart SAs ==="
        check_no_admin "helm-cilium"           "system:serviceaccount:kube-system:helm-cilium"
        check_no_admin "helm-cert-manager"     "system:serviceaccount:cert-manager:helm-cert-manager"
        check_no_admin "helm-external-secrets" "system:serviceaccount:external-secrets:helm-external-secrets"
        check_no_admin "helm-longhorn"         "system:serviceaccount:longhorn-system:helm-longhorn"
        check_no_admin "helm-dex"              "system:serviceaccount:dex:helm-dex"

        echo ""
        echo "=== Cross-namespace secret access (should all be no) ==="
        for ns_sa in "kube-system:helm-cilium" "cert-manager:helm-cert-manager" "external-secrets:helm-external-secrets" "longhorn-system:helm-longhorn" "dex:helm-dex"; do
          ns=${ns_sa%%:*}; sa=${ns_sa##*:}
          if kubectl auth can-i get secrets --as="system:serviceaccount:${ns}:${sa}" -n default 2>&1 | grep -q yes; then
            echo "FAIL: $sa can read secrets in default namespace"
            fail=1
          else
            echo "PASS: $sa cannot read secrets across namespaces"
          fi
        done

        exit $fail
