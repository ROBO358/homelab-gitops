name = "yh-probe"
main = "index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Probe every 1 minute; alert immediately on any failure
[triggers]
crons = ["* * * * *"]

# Set secrets via tasks:
#   task worker:secret:discord   (DISCORD_WEBHOOK_URL from 1Password monitoring-discord-worker)
#   task worker:secret:cf-access (CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET)
