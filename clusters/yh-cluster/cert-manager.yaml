apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cert-manager/controller
  prune: true
  serviceAccountName: flux-cert-manager
  dependsOn:
    - name: flux-rbac
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cert-manager/config
  prune: true
  serviceAccountName: flux-cert-manager-config
  dependsOn:
    - name: flux-rbac
    - name: cert-manager
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
