apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/external-secrets/controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/external-secrets/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: false because ClusterSecretStore Ready=True depends on onepassword-token Secret
  # existing before Flux applies this. Waiting would cause repeated 5m timeouts until
  # task eso:bootstrap-secret is run. Readiness is verified manually via task verify:eso.
  wait: false
