apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./apps
  prune: true
  # serviceAccountName not set → flux-system-root (cluster-admin) is used.
  # This bootstrap-tier Kustomization creates per-app SA/ClusterRole/Binding/ReferenceGrant,
  # so it needs cluster-admin. The per-app workload Kustomizations each run under their own
  # scoped SA (e.g. flux-sample-app), achieving tenant isolation in the workload tier.
  dependsOn:
    - name: flux-rbac
    - name: cloudflare-gateway-config  # ReferenceGrant targets cloudflare-gateway ns
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
