apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cloudflared/controller
  prune: true
  serviceAccountName: flux-cloudflared
  dependsOn:
    - name: flux-rbac
    - name: external-secrets-config   # ClusterSecretStore が Ready 後に ESO が Secret を同期する
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
