apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/dex/controller
  prune: true
  dependsOn:
    - name: external-secrets-config   # ExternalSecret が ClusterSecretStore を参照するため
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dex-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/dex/config
  prune: true
  dependsOn:
    - name: dex
    - name: cert-manager-config       # ClusterIssuer Ready 後
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
