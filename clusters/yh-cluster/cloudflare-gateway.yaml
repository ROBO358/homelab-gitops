apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cloudflare-gateway/controller
  prune: true
  serviceAccountName: flux-cloudflare-gateway
  dependsOn:
    - name: flux-rbac
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-gateway-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cloudflare-gateway/config
  prune: true
  serviceAccountName: flux-cloudflare-gateway-config
  dependsOn:
    - name: flux-rbac
    - name: cloudflare-gateway
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
