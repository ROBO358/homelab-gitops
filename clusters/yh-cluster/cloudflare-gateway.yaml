apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cloudflare-gateway/controller
  prune: true
  serviceAccountName: flux-cloudflare-gateway
  dependsOn:
    - name: flux-rbac
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-gateway-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cloudflare-gateway/config
  prune: true
  serviceAccountName: flux-cloudflare-gateway-config
  dependsOn:
    - name: flux-rbac
    - name: cloudflare-gateway
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# Deploys pl4nty/cloudflare-kubernetes-gateway controller manager from its own GitRepository
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-gateway-app
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./config/default
  prune: true
  serviceAccountName: flux-cloudflare-gateway
  targetNamespace: cloudflare-gateway
  dependsOn:
    - name: cloudflare-gateway
    - name: gateway-api-crds
  sourceRef:
    kind: GitRepository
    name: cloudflare-kubernetes-gateway
  wait: true
  timeout: 5m
