apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/external-dns/controller
  prune: true
  serviceAccountName: flux-external-dns
  dependsOn:
    - name: flux-rbac
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/external-dns/config
  prune: true
  serviceAccountName: flux-external-dns-config
  dependsOn:
    - name: flux-rbac
    - name: external-secrets-config
    - name: cilium-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
